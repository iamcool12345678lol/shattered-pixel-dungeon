name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned iOS app with RoboVM
        run: ./gradlew ios:createIPA -Probovm.skipSigning=true

      - name: Package IPA if only .app was generated
        run: |
          if [ ! -f ios/build/robovm/IOSLauncher.ipa ]; then
            mkdir -p Payload
            cp -r ios/build/robovm/IOSLauncher.app Payload/
            zip -r ShatteredPixelDungeon-unsigned.ipa Payload
            mv ShatteredPixelDungeon-unsigned.ipa ios/build/robovm/
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPixelDungeon-iOS
          path: ios/build/robovm/*.ipa
