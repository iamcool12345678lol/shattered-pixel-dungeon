name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure RoboVM to skip code signing
        run: |
          if ! grep -q "iosSkipSigning" ios/build.gradle; then
            printf "\nrobovm {\n    iosSkipSigning = true\n}\n" >> ios/build.gradle
          fi

      - name: Compile iOS IPA via RoboVM
        run: ./gradlew ios:createIPA -Probovm.arch=arm64 -Probovm.os=ios -Probovm.iosSkipSigning=true --no-daemon

      - name: Locate and verify IPA
        run: |
          set -e
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found, checking for .app bundle..."
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "Listing all build outputs:"
              find ios -maxdepth 4
              exit 1
            fi
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r -9 ShatteredPixelDungeon.ipa Payload
          else
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" ShatteredPixelDungeon.ipa
          fi
          ls -lh ShatteredPixelDungeon.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPixelDungeon-iOS
          path: ShatteredPixelDungeon.ipa
          retention-days: 30
